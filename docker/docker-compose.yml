version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cvshop
      POSTGRES_PASSWORD: cvshop
      POSTGRES_DB: cvshop_dev
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'

  api-gateway:
    build:
      context: ..
      dockerfile: ./apps/api-gateway/Dockerfile
    environment:
      PORT: 3000
      SERVICE_NAME: api-gateway
    ports: ['3000:3000']
    depends_on: [rabbitmq]

  auth-service:
    build:
      context: ..
      dockerfile: ./apps/auth-service/Dockerfile
    environment:
      PORT: 3001
      SERVICE_NAME: auth-service
    ports: ['3001:3001']
    depends_on: [postgres, rabbitmq]

  products-service:
    build:
      context: ..
      dockerfile: ./apps/products-service/Dockerfile
    environment:
      PORT: 3002
      SERVICE_NAME: products-service
    ports: ['3002:3002']
    depends_on: [postgres, rabbitmq]

  orders-service:
    build:
      context: ..
      dockerfile: ./apps/orders-service/Dockerfile
    environment:
      PORT: 3003
      SERVICE_NAME: orders-service
    ports: ['3003:3003']
    depends_on: [postgres, rabbitmq]

  payments-service:
    build:
      context: ..
      dockerfile: ./apps/payments-service/Dockerfile
    environment:
      PORT: 3004
      SERVICE_NAME: payments-service
    ports: ['3004:3004']
    depends_on: [rabbitmq]

  notifications-service:
    build:
      context: ..
      dockerfile: ./apps/notifications-service/Dockerfile
    environment:
      PORT: 3005
      SERVICE_NAME: notifications-service
    ports: ['3005:3005']
    depends_on: [rabbitmq]

volumes:
  pgdata:
